<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniConnect | Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background_overlay"></div>
    <div class="login_container">
        <div class="header">
            <img src="LOGO PIC.png" alt="UniConnect Logo" class="main_logo">
        </div>

        <div class="login_box">
            <form>
                <div class="input_group">
                    <label for="studentId">Student ID Number</label>
                    <div class="input_wrapper">
                        <i class="fas fa-id-card field_icon"></i>
                        <input type="text" id="studentId" placeholder="e.g 2024-2-1234" required>
                    </div>
                </div>
                
                <div class="input_group">
                    <label for="password">Password</label>
                    <div class="password_wrapper">
                        <i class="fas fa-lock field_icon"></i>
                        <input type="password" id="password" placeholder="•••••••" required>
                        <span class="toggle_password" id="togglePassword">
                            <i>👁</i>
                        </span>
                    </div>
                </div>

                <div class="extra_options">
                    <label class="checkbox_container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                </div>
                
                <div class="portal_notice">
                    <p><i class="fas fa-info-circle"></i> Accessing this portal allows you to view your school's overall development for a specific semester.</p>
                </div>
                
                <button type="submit" class="login_btn">
                    <i class="fas fa-shield-alt"></i> LOG IN
                </button>
            </form>
            
            <div class="footer">
                <p>Forgot password? <a href="#" class="footer_link">Contact the ICTD</a></p>
                <div class="school_year">
                    <i class="fas fa-calendar-alt"></i> A.Y 2025-2026
                </div>
            </div>
        </div>
        <p class="security_text"><i class="fas fa-lock"></i> Secured 256-bit SSL Connection</p>
    </div>
    <script src="login_script.js"></script>
</body>
</html>
